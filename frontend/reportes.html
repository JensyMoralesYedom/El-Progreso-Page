<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{var t=localStorage.getItem('elprogreso-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>Reportes - Finca Ganadera El Progreso</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .report-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding: 1.25rem;
      background: var(--white);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
    }
    .report-controls .report-select-group {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .report-controls label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--stone);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .report-controls select,
    .report-controls input {
      padding: 0.6rem 0.85rem;
      border: 2px solid var(--cream-dark);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      background: var(--cream);
      color: var(--carbon);
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .report-controls input[type="date"] {
      cursor: text;
    }
    .report-controls select:focus,
    .report-controls input:focus {
      outline: none;
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(42, 125, 82, 0.15);
      background: var(--white);
    }
    .filters-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding: 1.25rem;
      background: var(--white);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      align-items: flex-end;
    }
    .filters-bar .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
      min-width: 150px;
    }
    .filters-bar .filter-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--stone);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .filters-bar .filter-group select,
    .filters-bar .filter-group input {
      padding: 0.6rem 0.85rem;
      border: 2px solid var(--cream-dark);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      background: var(--cream);
      color: var(--carbon);
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .filters-bar .filter-group input[type="date"] {
      cursor: text;
    }
    .filters-bar .filter-group select:focus,
    .filters-bar .filter-group input:focus {
      outline: none;
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(42, 125, 82, 0.15);
      background: var(--white);
    }
    .btn-clear-filters {
      padding: 0.6rem 1.2rem;
      background: var(--cream);
      color: var(--stone);
      border: 2px solid var(--cream-dark);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .btn-clear-filters:hover {
      background: var(--cream-dark);
      color: var(--carbon);
      border-color: var(--stone-light);
    }
    .export-buttons {
      display: flex;
      gap: 0.5rem;
    }
    .btn-export {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-export:hover {
      transform: translateY(-1px);
    }
    .btn-export-pdf {
      background: #FEF2F2;
      color: #B91C1C;
    }
    .btn-export-pdf:hover {
      background: #FECACA;
      box-shadow: 0 2px 8px rgba(185, 28, 28, 0.2);
    }
    .btn-export-excel {
      background: #F0FDF4;
      color: #15803D;
    }
    .btn-export-excel:hover {
      background: #DCFCE7;
      box-shadow: 0 2px 8px rgba(21, 128, 61, 0.2);
    }
    .table-responsive {
      overflow-x: auto;
    }
    .summary-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1rem 1.25rem;
      background: linear-gradient(135deg, var(--forest), var(--leaf));
      border-radius: 12px;
      color: var(--white);
    }
    .summary-item {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .summary-item i {
      margin-right: 0.4rem;
      opacity: 0.85;
    }
    @media (max-width: 768px) {
      .filters-bar {
        flex-direction: column;
      }
      .filters-bar .filter-group {
        min-width: 100%;
      }
      .report-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .export-buttons {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body class="shell-body" data-page="reportes">

  <div class="shell-layout">
    <div id="sidebarContainer"></div>

    <div class="shell-main">
      <header class="shell-header" id="shellHeader"></header>

      <main class="shell-content" id="shellContent">
        <div class="page-title-wrap">
          <h2 class="page-title">Reportes</h2>
          <p class="page-subtitle">Informes por módulo con filtros y exportación PDF/Excel</p>
        </div>

        <!-- Selector de módulo -->
        <div class="report-controls">
          <div class="report-select-group">
            <label for="selectReporte">Módulo del reporte</label>
            <select id="selectReporte"></select>
          </div>
          <div class="report-select-group">
            <label for="reporteDesde">Desde</label>
            <input type="date" id="reporteDesde">
          </div>
          <div class="report-select-group">
            <label for="reporteHasta">Hasta</label>
            <input type="date" id="reporteHasta">
          </div>
          <button class="btn-clear-filters" id="btnClearFilters"><i class="fas fa-times"></i> Limpiar</button>
        </div>

        <!-- Filtros específicos del módulo -->
        <div class="filters-bar" id="filtersBar"></div>

        <!-- Resumen de totales -->
        <div class="summary-bar" id="summaryBar" style="display:none;"></div>

        <div class="data-table-container">
          <div class="table-header">
            <h3 id="reportTitle"><i class="fas fa-file-alt"></i> Informe General</h3>
            <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
              <span id="totalRegistros" style="color: #666; font-size: 0.9rem;"></span>
              <div class="export-buttons">
                <button class="btn-export btn-export-pdf" id="btnExportPDF" title="Exportar como PDF">
                  <i class="fas fa-file-pdf"></i> PDF
                </button>
                <button class="btn-export btn-export-excel" id="btnExportExcel" title="Exportar como Excel">
                  <i class="fas fa-file-excel"></i> Excel
                </button>
              </div>
            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table" id="reportTable">
              <thead id="tableHead"></thead>
              <tbody id="tableBody">
                <tr><td colspan="2" class="no-data"><i class="fas fa-spinner fa-spin"></i><p>Cargando reporte...</p></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/reportes.js"></script>
</body>
</html>
