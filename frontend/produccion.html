<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{var t=localStorage.getItem('elprogreso-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>Producción - Finca Ganadera El Progreso</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="shell-body" data-page="produccion">

  <div class="shell-layout">
    <div id="sidebarContainer"></div>

    <div class="shell-main">
      <header class="shell-header" id="shellHeader"></header>

      <main class="shell-content">
        <h2 class="page-title">Producción de Leche</h2>
        <p class="page-subtitle">Registro diario de ordeño por animal y turno</p>

        <div class="no-access-banner" id="noAccessBanner" style="display:none;">
          <i class="fas fa-lock"></i> <span>Su rol no tiene acceso al módulo de producción.</span>
        </div>

        <div id="produccionContent" style="display:none;">
          <div class="kpi-grid">
            <div class="kpi-card kpi-forest">
              <div class="kpi-icon"><i class="fas fa-tint"></i></div>
              <div class="kpi-value" id="kpiTotalLitros">0</div>
              <div class="kpi-label">Total litros</div>
            </div>
            <div class="kpi-card kpi-blue">
              <div class="kpi-icon"><i class="fas fa-sun"></i></div>
              <div class="kpi-value" id="kpiManana">0</div>
              <div class="kpi-label">Turno mañana</div>
            </div>
            <div class="kpi-card kpi-wheat">
              <div class="kpi-icon"><i class="fas fa-moon"></i></div>
              <div class="kpi-value" id="kpiTarde">0</div>
              <div class="kpi-label">Turno tarde</div>
            </div>
            <div class="kpi-card kpi-red">
              <div class="kpi-icon"><i class="fas fa-calendar-alt"></i></div>
              <div class="kpi-value" id="kpiDias">0</div>
              <div class="kpi-label">Días registrados</div>
            </div>
          </div>

          <div class="data-table-container" style="margin-top:1.5rem;">
            <div class="table-header">
              <h3><i class="fas fa-tint"></i> Registros de ordeño</h3>
              <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
                <input type="date" id="filtroFecha" style="padding:0.6rem 0.85rem;border:2px solid var(--cream-dark);border-radius:8px;font-family:'DM Sans',sans-serif;background:var(--cream);">
                <button class="btn-new" id="btnNewProduccion">
                  <i class="fas fa-plus"></i> Nueva Producción
                </button>
              </div>
            </div>
            <table class="data-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Fecha</th>
                  <th>Animal</th>
                  <th>Turno</th>
                  <th>Litros</th>
                  <th>Observaciones</th>
                </tr>
              </thead>
              <tbody id="produccionBody">
                <tr><td colspan="6" class="no-data"><i class="fas fa-spinner fa-spin"></i><p>Cargando registros...</p></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ========== MODAL PRODUCCIÓN ========== -->
  <div class="modal-overlay" id="produccionModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Nueva Producción</h3>
        <button class="modal-close" id="produccionClose">&times;</button>
      </div>
      <div class="modal-body">
        <form id="produccionForm">
          <div class="form-group">
            <label for="prodAnimal">Animal *</label>
            <select id="prodAnimal" required>
              <option value="">Seleccione un animal</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="prodFecha">Fecha</label>
              <input type="date" id="prodFecha">
            </div>
            <div class="form-group">
              <label for="prodTurno">Turno *</label>
              <select id="prodTurno" required>
                <option value="">Seleccione</option>
                <option value="Mañana">Mañana</option>
                <option value="Tarde">Tarde</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="prodLitros">Litros *</label>
            <input type="number" id="prodLitros" step="0.01" min="0" placeholder="Ej: 12.5" required>
          </div>
          <div class="form-group">
            <label for="prodObs">Observaciones</label>
            <textarea id="prodObs" maxlength="300" rows="2" placeholder="Comentarios"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="produccionCancel">Cancelar</button>
        <button class="btn-save" id="produccionSave">Guardar</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/produccion.js"></script>
</body>
</html>
