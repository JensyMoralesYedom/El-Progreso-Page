<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Finca Ganadera El Progreso</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo-section">
        <img src="img/Logo.png" alt="Logo El Progreso">
        <h2>Finca Ganadera El Progreso</h2>
        <p>Inicie sesión para acceder al sistema</p>
      </div>

      <div class="auth-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Su contraseña" required>
        </div>
        <button type="submit" class="btn-auth" id="btnLogin">
          <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>
      </form>

      <div class="auth-divider">o</div>

      <button class="btn-guest" id="btnGuest">
        <i class="fas fa-user-clock"></i> Entrar como Invitado
      </button>

      <div class="auth-footer">
        ¿No tiene cuenta? <a href="registro.html">Regístrese aquí</a>
      </div>
      <div class="auth-footer" style="margin-top: 0.5rem;">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect') || 'gestion.html';

      if (Auth.isLoggedIn()) {
        window.location.href = redirect;
        return;
      }

      const loginForm = document.getElementById('loginForm');
      const btnLogin = document.getElementById('btnLogin');
      const btnGuest = document.getElementById('btnGuest');
      const loginError = document.getElementById('loginError');

      function showError(msg) {
        loginError.textContent = msg;
        loginError.classList.add('show');
      }

      function hideError() {
        loginError.classList.remove('show');
      }

      loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          showError('Por favor, complete todos los campos.');
          return;
        }

        btnLogin.disabled = true;
        btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Ingresando...';

        try {
          const result = await Auth.login(email, password);

          if (result.success) {
            Auth.setSession(result.token, result.user);
            window.location.href = redirect;
          } else {
            showError(result.error || 'Credenciales incorrectas');
          }
        } catch (err) {
          showError('Error de conexión. Intente nuevamente.');
        } finally {
          btnLogin.disabled = false;
          btnLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
        }
      });

      btnGuest.addEventListener('click', async function () {
        hideError();
        btnGuest.disabled = true;
        btnGuest.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Conectando...';

        try {
          const result = await Auth.loginInvitado();

          if (result.success) {
            Auth.setSession(result.token, result.user);
            window.location.href = redirect;
          } else {
            showError('Error al acceder como invitado');
          }
        } catch (err) {
          showError('Error de conexión. Intente nuevamente.');
        } finally {
          btnGuest.disabled = false;
          btnGuest.innerHTML = '<i class="fas fa-user-clock"></i> Entrar como Invitado';
        }
      });
    });
  </script>
</body>
</html>
